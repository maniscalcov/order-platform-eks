# Grafana dashboard as code. The kube-prometheus-stack Grafana sidecar loads
# any ConfigMap labelled grafana_dashboard="1" from ANY namespace
# (kps-values.yaml: sidecar.dashboards.searchNamespace: ALL), so ArgoCD
# deploys this like every other manifest - no clicking around in the UI.
# Edit in Grafana, then Share -> Export -> JSON and paste back here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-order-platform
  namespace: order-platform
  labels:
    grafana_dashboard: "1"
data:
  order-platform.json: |
    {
      "uid": "order-platform-slos",
      "title": "Order Platform - SLOs & Saga",
      "tags": [
        "order-platform",
        "slo"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source",
            "current": {},
            "hide": 0
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "SLOs - POST /orders (availability 99.5%, latency 99% < 250ms)",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Availability SLI (30m)",
          "id": 2,
          "description": "Share of POST /orders that did not return 5xx. SLO: 99.5%.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - slo:sli_error:ratio_rate30m{slo=\"orders-availability\"}",
              "legendFormat": "",
              "refId": "A",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no traffic",
              "decimals": 3
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Latency SLI (30m)",
          "id": 3,
          "description": "Share of POST /orders faster than 250ms. SLO: 99%.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - slo:sli_error:ratio_rate30m{slo=\"orders-latency\"}",
              "legendFormat": "",
              "refId": "A",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no traffic",
              "decimals": 2
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Availability budget left (24h)",
          "id": 4,
          "description": "1 = untouched, 0 = spent, negative = SLO breached.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "slo:error_budget_remaining:ratio_1d{slo=\"orders-availability\"}",
              "legendFormat": "",
              "refId": "A",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no traffic",
              "decimals": 1
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Latency budget left (24h)",
          "id": 5,
          "description": "1 = untouched, 0 = spent, negative = SLO breached.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "slo:error_budget_remaining:ratio_1d{slo=\"orders-latency\"}",
              "legendFormat": "",
              "refId": "A",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no traffic",
              "decimals": 1
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Orders / sec",
          "id": 6,
          "description": "Orders durably written to DynamoDB.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(orders_created_total[1m]))",
              "legendFormat": "",
              "refId": "A",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no traffic",
              "decimals": 1
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Firing alerts",
          "id": 7,
          "description": "SLO burn-rate + saga alerts from slo-rules.yaml.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",team=\"order-platform\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "area",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "no traffic"
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "API (RED)",
          "id": 8,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "order-api requests / sec by status",
          "id": 9,
          "description": "Excludes /health and /metrics (probe/scrape traffic).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (status) (rate(http_requests_total{job=\"order-api\"}[1m]))",
              "legendFormat": "{{status}}",
              "refId": "A",
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "POST /orders latency (SLO threshold 250ms)",
          "id": 10,
          "description": "Dashed red line = latency SLO threshold.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"order-api\",method=\"POST\",route=\"/orders\"}[1m])))",
              "legendFormat": "p50",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"order-api\",method=\"POST\",route=\"/orders\"}[1m])))",
              "legendFormat": "p95",
              "refId": "B",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"order-api\",method=\"POST\",route=\"/orders\"}[1m])))",
              "legendFormat": "p99",
              "refId": "C",
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.25
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Autoscaling - KEDA (SQS depth) and HPA (CPU)",
          "id": 11,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "inventory-worker: queue depth vs replicas",
          "id": 12,
          "description": "KEDA targets 20 msgs/replica, min 1 max 6. Replicas on the right axis.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(keda_scaler_metrics_value{scaledObject=\"inventory-worker\"})",
              "legendFormat": "queue depth (KEDA)",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_status_replicas{namespace=\"order-platform\",deployment=\"inventory-worker\"})",
              "legendFormat": "replicas",
              "refId": "B",
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "replicas"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineInterpolation",
                    "value": "stepAfter"
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "payment-worker: queue depth vs replicas",
          "id": 13,
          "description": "KEDA targets 20 msgs/replica, min 1 max 6. Replicas on the right axis.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(keda_scaler_metrics_value{scaledObject=\"payment-worker\"})",
              "legendFormat": "queue depth (KEDA)",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_status_replicas{namespace=\"order-platform\",deployment=\"payment-worker\"})",
              "legendFormat": "replicas",
              "refId": "B",
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "replicas"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineInterpolation",
                    "value": "stepAfter"
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "order-api: CPU vs replicas (HPA)",
          "id": 14,
          "description": "HPA target 70% of CPU requests, min 2 max 10.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"order-platform\",container=\"order-api\"}[1m])) / sum(kube_pod_container_resource_requests{namespace=\"order-platform\",container=\"order-api\",resource=\"cpu\"})",
              "legendFormat": "CPU % of requests",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_deployment_status_replicas{namespace=\"order-platform\",deployment=\"order-api\"})",
              "legendFormat": "replicas",
              "refId": "B",
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0.7
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "replicas"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.lineInterpolation",
                    "value": "stepAfter"
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Saga - order -> inventory -> payment",
          "id": 15,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Worker messages / sec by outcome",
          "id": 16,
          "description": "error = left on the queue for redelivery (DLQ after maxReceiveCount).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (container, outcome) (rate(worker_messages_total[1m]))",
              "legendFormat": "{{container}} {{outcome}}",
              "refId": "A",
              "range": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Worker processing time p95",
          "id": 17,
          "description": "payment-worker includes 50-300ms simulated gateway latency.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (container, le) (rate(worker_message_duration_seconds_bucket[1m])))",
