# Same pattern as inventory-worker. Payment queue depth also rises when the
# injected 10% failures cause retries, so this scales on real work pending.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment-worker
  namespace: order-platform
spec:
  scaleTargetRef:
    name: payment-worker
  minReplicaCount: 1
  maxReplicaCount: 6
  pollingInterval: 15
  cooldownPeriod: 120
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws
      metadata:
        queueURL: https://sqs.us-east-2.amazonaws.com/584477830979/order-platform-payment
        awsRegion: us-east-2
        queueLength: "20"
