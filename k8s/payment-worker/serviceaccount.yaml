# The narrowest role of the three. payment-worker is the terminal consumer
# in the saga - it reads one table and drains one queue, nothing else.
#
# BEFORE APPLYING: replace <ACCOUNT_ID>. Trust policy must name
# "system:serviceaccount:order-platform:payment-worker".
#
# Permissions needed:
#   - dynamodb:GetItem, dynamodb:UpdateItem on the orders table
#   - sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes
#     on the payment queue
# Note there is NO sqs:SendMessage anywhere: nothing comes after this
# service, so it has no ability to publish at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-worker
  namespace: order-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::584477830979:role/order-platform-payment-worker
