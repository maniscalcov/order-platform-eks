# Phase 2 verified this scales under load: run the k6 job, then watch
# `kubectl get hpa -n order-platform -w` and see replicas climb.
#
# REQUIRES metrics-server. It is installed as an EKS add-on in
# terraform/eks.tf, so it comes up with the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-api
  namespace: order-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-api
  minReplicas: 2
  maxReplicas: 10

  metrics:
    # CPU only. Memory was removed: Python processes don't give memory back
    # after a spike, so a memory target kept replicas pinned above the floor
    # long after load ended.
    #
    # 70% of the 100m CPU *request* (not the limit), so ~70m sustained per
    # pod triggers a scale-up. Raised from 60: the Phase 2 load test showed
    # p95 stayed at 90ms even at ~200% of request, so 60 was wasting pods.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

  # Asymmetric on purpose: scale up fast, scale down slowly.
  # Scaling up late costs you dropped requests; scaling down early causes
  # flapping, where the HPA removes pods and immediately needs them back.
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100        # allowed to double the replica count...
          periodSeconds: 30 # ...every 30s
    scaleDown:
      stabilizationWindowSeconds: 300  # wait 5 min of sustained low load
      policies:
        - type: Pods
          value: 1          # then remove just one pod at a time
          periodSeconds: 60
