# IRSA (IAM Roles for Service Accounts) is how the pod gets AWS credentials
# without any access keys in the image, in a Secret, or on the node.
#
# How it works: the EKS OIDC provider (created in your Phase 1 irsa.tf)
# lets this ServiceAccount assume an IAM role. The AWS SDK inside the pod
# (boto3) picks up a projected token automatically - which is why db.py and
# queue.py just call boto3.resource(...) with no credentials anywhere.
#
# BEFORE APPLYING: replace <ACCOUNT_ID> with your AWS account ID, and make
# sure the role's trust policy names this exact namespace + SA
# ("system:serviceaccount:order-platform:order-api"). The role needs:
#   - dynamodb:PutItem, dynamodb:GetItem on the orders table
#   - sqs:SendMessage on the inventory queue
# Nothing more - least privilege is worth calling out in your write-up.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-api
  namespace: order-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::584477830979:role/order-platform-order-api
