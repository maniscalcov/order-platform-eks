# Separate SA (and separate IAM role) from order-api on purpose. If all
# three services shared one role, that role would need the union of every
# permission and a compromise of any one pod would reach all of it.
#
# BEFORE APPLYING: replace <ACCOUNT_ID>. Trust policy must name
# "system:serviceaccount:order-platform:inventory-worker".
#
# This role is the widest of the three, because inventory-worker is the
# only service that both consumes and produces:
#   - dynamodb:UpdateItem on the orders table (status transitions only)
#   - dynamodb:UpdateItem on the inventory table (reserve + release)
#   - sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes
#     on the inventory queue
#   - sqs:SendMessage on the payment queue
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-worker
  namespace: order-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::584477830979:role/order-platform-inventory-worker
